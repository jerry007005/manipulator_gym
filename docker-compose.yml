version: "3.9"

services:
  manipulator:
    build:
      context: .
      dockerfile: Dockerfile
    
    runtime: nvidia
    container_name: trossen_ros2

    # GPU
    gpus: all

    network_mode: host
    command: bash
    privileged: true
    
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./entrypoint.sh:/entrypoint.sh

    # 摄像头 USB
    # devices:
    #   - /dev/video0:/dev/video0

    stdin_open: true
    tty: true